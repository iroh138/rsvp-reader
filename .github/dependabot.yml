# Keeps pinned action SHAs up to date through reviewed pull requests (INF-02).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /deploy
    schedule:
      interval: weekly
